<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#9cc3dc" />
    <title>Topo Heli</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <div class="hud-top">
        <div class="pill" id="timer">3:00</div>
        <div class="target-card">
          <div class="target-label" id="target-label">Fly to</div>
          <div class="target-name" id="target-name">—</div>
          <div class="target-hint" id="target-hint"></div>
          <div class="progress" id="river-progress" hidden><div></div></div>
        </div>
        <div class="pill stats">
          <span><b id="score">0</b> <span data-i18n="found">found</span></span>
          <span class="lvl"><span data-i18n="level">Level</span> <b id="level">1</b></span>
        </div>
      </div>
      <div class="hud-bottom">
        <button class="btn small ghost" id="btn-pause" title="P / Esc" data-i18n="pause">Pause</button>
        <button class="btn small ghost" id="btn-skip" title="N" data-i18n="skip">Skip −10s</button>
        <button class="btn small ghost" id="btn-mute" title="M">Sound on</button>
      </div>
      <canvas id="minimap"></canvas>
      <div class="toast" id="toast" hidden></div>
    </div>

    <div class="overlay" id="menu">
      <div class="panel">
        <div class="lang" id="lang"></div>
        <div class="logo">🚁</div>
        <h1>Topo Heli</h1>
        <p class="sub" data-i18n="subtitle">Fly your helicopter to as many cities as you can before time runs out.</p>
        <!-- Settings: a label column and the choices next to it. -->
        <div class="settings">
          <span class="row-label" data-i18n="mapLabel">Map</span>
          <div class="map-select" id="map-select"></div>
          <label class="row-label" for="region" id="region-label" hidden>Province</label>
          <div class="row-value" id="region-box" hidden><select id="region"></select></div>
          <span class="row-label" id="mode-label" data-i18n="modeLabel" hidden>Mode</span>
          <div class="row-value" id="mode-box" hidden>
            <div class="segmented">
              <button type="button" id="mode-free" data-i18n="modeFree">Against the clock</button>
              <button type="button" id="mode-list" data-i18n="modeList">Find them all</button>
            </div>
            <p class="mode-desc" id="mode-desc"></p>
          </div>
          <span class="row-label" id="physical-row" hidden></span>
          <label class="toggle row-value" id="physical-toggle" hidden>
            <input type="checkbox" id="opt-physical" />
            <span class="switch"></span>
            <span id="physical-label">Mountains, rivers &amp; lakes</span>
          </label>
        </div>
        <button class="btn primary" id="btn-start" data-i18n="start">Start</button>
        <p class="best" id="best"></p>
        <details class="howto-box" id="howto-box">
          <summary data-i18n="howtoTitle">How to play</summary>
          <ul class="howto">
            <li data-i18n="howtoFly"></li>
            <li data-i18n="howtoFlash"></li>
            <li id="howto-levels"></li>
            <li id="howto-physical" hidden></li>
            <li id="howto-practice" hidden></li>
          </ul>
        </details>
        <div class="small-actions">
          <button class="btn small ghost" id="btn-share" data-i18n="share">Share</button>
          <button class="btn small ghost" id="btn-feedback" data-i18n="feedback">Feedback</button>
        </div>
        <div class="fine-print">
          <span data-i18n="inspiredBy"></span>
          <span data-i18n="credits"></span>
          <span id="privacy" data-i18n="privacy" hidden></span>
          <span id="feedback-privacy" data-i18n="feedbackPrivacy"></span>
        </div>
      </div>
    </div>

    <div class="overlay" id="pause" hidden>
      <div class="panel">
        <h2 data-i18n="paused">Paused</h2>
        <button class="btn primary" id="btn-resume" data-i18n="resume">Resume</button>
        <button class="btn ghost" id="btn-quit" data-i18n="quit">Quit to menu</button>
      </div>
    </div>

    <div class="overlay" id="over" hidden>
      <div class="panel over-panel">
        <h2 id="over-title" data-i18n="timeUp">Time's up!</h2>
        <div class="final"><b id="final-score">0</b> <span id="final-label">places found</span></div>
        <p class="best" id="final-best"></p>
        <!-- Name groups: found / not found, or (Basislijst mode) the ones to practise again. -->
        <div class="over-groups" id="over-groups"></div>
        <button class="btn primary" id="btn-again" data-i18n="playAgain">Play again</button>
        <button class="btn ghost" id="btn-menu" data-i18n="menu">Choose another game</button>
        <div class="small-actions">
          <button class="btn small ghost" id="btn-share-over" data-i18n="share">Share</button>
          <button class="btn small ghost" id="btn-feedback-over" data-i18n="feedback">Feedback</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
