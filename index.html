<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#9cc3dc" />
    <title>Topo Heli</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <div class="hud-top">
        <div class="pill" id="timer">3:00</div>
        <div class="target-card">
          <div class="target-label" id="target-label">Fly to</div>
          <div class="target-name" id="target-name">—</div>
          <div class="target-hint" id="target-hint"></div>
          <div class="progress" id="river-progress" hidden><div></div></div>
        </div>
        <div class="pill stats">
          <span><b id="score">0</b> <span data-i18n="found">found</span></span>
          <span class="lvl"><span data-i18n="level">Level</span> <b id="level">1</b></span>
        </div>
      </div>
      <div class="hud-bottom">
        <button class="btn small ghost" id="btn-pause" title="P / Esc" data-i18n="pause">Pause</button>
        <button class="btn small ghost" id="btn-skip" title="N" data-i18n="skip">Skip −10s</button>
        <button class="btn small ghost" id="btn-mute" title="M">Sound on</button>
      </div>
      <canvas id="minimap"></canvas>
      <div class="toast" id="toast" hidden></div>
    </div>

    <div class="overlay" id="menu">
      <div class="panel">
        <div class="lang" id="lang"></div>
        <div class="logo">🚁</div>
        <h1>Topo Heli</h1>
        <p class="sub" data-i18n="subtitle">Fly your helicopter to as many cities as you can before time runs out.</p>
        <div class="map-select" id="map-select"></div>
        <label class="region" id="region-box" hidden>
          <span id="region-label">Province</span>
          <select id="region"></select>
        </label>
        <label class="toggle" id="practice-toggle" hidden>
          <input type="checkbox" id="opt-practice" />
          <span class="switch"></span>
          <span id="practice-label">Basislijst</span>
        </label>
        <label class="toggle" id="physical-toggle" hidden>
          <input type="checkbox" id="opt-physical" />
          <span class="switch"></span>
          <span id="physical-label">Mountains, rivers &amp; lakes</span>
        </label>
        <p class="best" id="best"></p>
        <button class="btn primary" id="btn-start" data-i18n="start">Start</button>
        <ul class="howto">
          <li data-i18n="howtoFly"></li>
          <li data-i18n="howtoFlash"></li>
          <li id="howto-levels"></li>
          <li id="howto-physical" hidden></li>
          <li id="howto-practice" hidden></li>
        </ul>
        <button class="btn small ghost feedback" id="btn-feedback" data-i18n="feedback">Feedback</button>
        <p class="credits" data-i18n="credits"></p>
        <p class="credits" data-i18n="inspiredBy"></p>
        <p class="credits" id="privacy" data-i18n="privacy" hidden></p>
        <p class="credits" data-i18n="feedbackPrivacy"></p>
      </div>
    </div>

    <div class="overlay" id="pause" hidden>
      <div class="panel">
        <h2 data-i18n="paused">Paused</h2>
        <button class="btn primary" id="btn-resume" data-i18n="resume">Resume</button>
        <button class="btn ghost" id="btn-quit" data-i18n="quit">Quit to menu</button>
      </div>
    </div>

    <div class="overlay" id="over" hidden>
      <div class="panel">
        <h2 id="over-title" data-i18n="timeUp">Time's up!</h2>
        <div class="final"><b id="final-score">0</b> <span id="final-label">places found</span></div>
        <p class="best" id="final-best"></p>
        <p class="missed" id="final-missed"></p>
        <div class="found-list" id="found-list"></div>
        <button class="btn primary" id="btn-again" data-i18n="playAgain">Play again</button>
        <button class="btn ghost" id="btn-menu" data-i18n="menu">Menu</button>
        <button class="btn small ghost feedback" id="btn-feedback-over" data-i18n="feedback">Feedback</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
